name: Frontend CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # `next build` runs the TypeScript type-check — this is the gate that catches
    # production-only type errors that `next dev` silently skips.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build if a high/critical CVE lands in a PRODUCTION dependency.
      # Dev-only tooling advisories are excluded (they never ship).
      #
      # --ignore-registry-errors exits 0 when the registry itself is
      # unreachable. pnpm already retries the fetch twice; when all three
      # attempts time out (ERR_SOCKET_TIMEOUT from npmjs.org failed this job on
      # 4 Sep 2026) the FetchError would otherwise fail the build for network
      # weather rather than for a vulnerability. A real advisory still fails:
      # the flag only swallows errors raised before any report is produced.
      #
      # The grep turns that silent pass into a run annotation - an unaudited
      # build should be visible, not indistinguishable from a clean one.
      - name: Security audit (production deps)
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level high --ignore-registry-errors 2>&1 | tee "$RUNNER_TEMP/audit.log"
          if grep -qiE 'ERR_SOCKET_TIMEOUT|FetchError|Socket timeout|ENOTFOUND|ECONNRESET|socket hang up' "$RUNNER_TEMP/audit.log"; then
            echo "::warning title=Audit skipped::The npm registry was unreachable, so production dependencies were not audited in this run."
          fi

      # Blocking: fails on error-level rules. `any`, unused-vars, and the React
      # Compiler readiness rules are warnings (tracked debt) and do not block.
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # `build:next` is the raw `next build` (the type-check gate). The plain
      # `build` script runs the Cloudflare adapter, which CI does not need.
      - name: Build (includes type-check)
        run: pnpm run build:next
