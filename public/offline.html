<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · GS-26 Admin Console</title>
<link rel="icon" href="/icon-192.png" />
<style>
  /* The console is dark-only, so the offline fallback is too — a light page
     here reads as a different site having taken over. Colours are the summit
     tokens from globals.css, inlined because this page is served by the
     service worker with no stylesheet available. */
  :root {
    --violet: #090415;
    --lilac: #f6f4fb;
    --smoke: #9a94ad;
    --cerise: #e5259a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--lilac); background: var(--violet);
  }
  .card {
    width: 100%; max-width: 420px; text-align: center;
    background: rgba(246, 244, 251, 0.04);
    border: 1px solid rgba(246, 244, 251, 0.12);
    border-radius: 20px; padding: 40px 32px;
  }
  img { width: 56px; height: 56px; margin: 0 0 20px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; color: var(--smoke); margin: 0 0 24px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--cerise);
    border: none; border-radius: 20px; padding: 10px 20px; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" />
    <h1>You&rsquo;re offline</h1>
    <p>
      The GS-26 admin console can&rsquo;t be reached right now. Check your
      connection &mdash; session status and agenda changes will sync when you
      reconnect.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
